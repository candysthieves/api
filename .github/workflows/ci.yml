name: CI

on:
  push:
    branches: [developer, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client without a database connection
        run: pnpm exec prisma generate --config apps/main/prisma.config.ts
        env:
          NODE_ENV: testing
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm run build:main
      - run: pnpm run build:files
