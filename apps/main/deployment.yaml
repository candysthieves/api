apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: JWT_SECRET_REFRESH_KEY
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: JWT_SECRET_REFRESH_KEY
             - name: JWT_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: JWT_EXPIRES_IN
             - name: JWT_REFRESH_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: JWT_REFRESH_EXPIRES_IN
             - name: EMAIL_CONFIRMATION_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: EMAIL_CONFIRMATION_EXPIRES_IN
             - name: PASSWORD_RECOVERY_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: PASSWORD_RECOVERY_EXPIRES_IN
             - name: SMTP_USER
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: SMTP_USER
             - name: SMTP_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: SMTP_PASSWORD
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: NODE_ENV
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: DATABASE_URL
             - name: GOOGLE_CLIENT_ID
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: GOOGLE_CLIENT_ID
             - name: GOOGLE_CLIENT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: GOOGLE_CLIENT_SECRET
             - name: RECAPTCHA_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: RECAPTCHA_SECRET_KEY
             - name: APP_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: APP_URL
             - name: RECAPTCHA_ALLOWED_HOSTNAMES
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: RECAPTCHA_ALLOWED_HOSTNAMES
             - name: CLIENT_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: CLIENT_URL
             - name: GITHUB_CLIENT_ID
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: GITHUB_CLIENT_ID
             - name: GITHUB_CLIENT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: GITHUB_CLIENT_SECRET
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: RABBITMQ_URL
             - name: RABBITMQ_MAIN_TO_FILES_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: RABBITMQ_MAIN_TO_FILES_QUEUE
             - name: RABBITMQ_FILES_TO_MAIN_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: RABBITMQ_FILES_TO_MAIN_QUEUE
             - name: JWT_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-main-production-config-secret
                   key: JWT_SECRET_KEY
