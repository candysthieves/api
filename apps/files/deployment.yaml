apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: TCP_PORT
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: TCP_PORT
             - name: MONGODB_URI
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: MONGODB_URI
             - name: S3_REGION
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: S3_REGION
             - name: S3_BUCKET
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: S3_BUCKET
             - name: S3_ACCESS_KEY_ID
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: S3_ACCESS_KEY_ID
             - name: S3_SECRET_ACCESS_KEY
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: S3_SECRET_ACCESS_KEY
             - name: PORT
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: PORT
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_URL
             - name: RABBITMQ_MAIN_TO_FILES_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_MAIN_TO_FILES_QUEUE
             - name: RABBITMQ_FILES_TO_MAIN_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_FILES_TO_MAIN_QUEUE
             - name: TCP_HOST
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: TCP_HOST
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_URL
             - name: RABBITMQ_MAIN_TO_FILES_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_MAIN_TO_FILES_QUEUE
             - name: RABBITMQ_FILES_TO_MAIN_QUEUE
               valueFrom:
                 secretKeyRef:
                   name: lumosapp-backend-files-production-config-secret
                   key: RABBITMQ_FILES_TO_MAIN_QUEUE
