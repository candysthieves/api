# Linux VPS. Runtime settings are read from .main.env and .files.env.
# Requires Docker Compose >= 2.30.0 (env_file format: raw).
name: lumosapp

services:
  files:
    image: chites/lumos-files:latest
    network_mode: host
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.files.env
        format: raw
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  main:
    image: chites/lumos-main:latest
    network_mode: host
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.main.env
        format: raw
    environment:
      NODE_ENV: production
    depends_on:
      - files
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
